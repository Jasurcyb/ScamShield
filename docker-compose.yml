version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres

  bot:
    build: .
    command: ["bot"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=scamshield
      - POSTGRES_PASSWORD=scamshield_dev
      - POSTGRES_DB=scamshield
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamshield"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
