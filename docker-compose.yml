# Container hardening rationale: the app parses untrusted files (Pillow,
# oletools, pypdf, ffmpeg) and fetches untrusted URLs. A parser exploit must
# stay trapped: no root, no capabilities, no privilege escalation, read-only
# filesystem, writable only /tmp (tempfile target for uploads).
x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m

services:  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    <<: *hardening
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  bot:
    build: .
    command: ["bot"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    <<: *hardening

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=scamshield
      - POSTGRES_PASSWORD=scamshield_dev
      - POSTGRES_DB=scamshield
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamshield"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
